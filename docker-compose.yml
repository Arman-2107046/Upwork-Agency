# Production stack for Coolify (Docker Compose build pack) or any Docker host.
#   app: React site + JSON API + Filament admin (/admin), one image built from ./Dockerfile
#   db:  PostgreSQL 17
#
# On Coolify nothing has to be set before the first deploy: Coolify generates the app key and
# the database password (SERVICE_PASSWORD_*) and fills in the URL from the domain you give the
# app service (SERVICE_URL_APP_8080 = the container listens on port 8080). Optional settings
# (first admin, email) go in the "Environment Variables" tab. See README.md.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - SERVICE_URL_APP_8080
      - APP_URL=${SERVICE_URL_APP}
      - APP_KEY=${SERVICE_PASSWORD_APPKEY}
      - APP_NAME=${APP_NAME:-Kernel Cloud Labs}
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-bytecode}
      - DB_USERNAME=${DB_USERNAME:-bytecode}
      - DB_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - SESSION_DRIVER=database
      - SESSION_SECURE_COOKIE=${SESSION_SECURE_COOKIE:-true}
      - CACHE_STORE=database
      - QUEUE_CONNECTION=sync
      - LOG_LEVEL=${LOG_LEVEL:-warning}
      # First admin, created on the first start only. Change the password in the admin afterwards.
      - ADMIN_NAME=${ADMIN_NAME:-Admin}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      # Contact form emails. With MAIL_MAILER=log, messages are only kept in the admin inbox.
      - MAIL_MAILER=${MAIL_MAILER:-log}
      - MAIL_HOST=${MAIL_HOST:-}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - MAIL_SCHEME=${MAIL_SCHEME:-}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS:-hello@example.com}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-Kernel Cloud Labs}
      - CONTACT_NOTIFY_EMAIL=${CONTACT_NOTIFY_EMAIL:-}
    volumes:
      # Uploaded images and videos (and the original screenshots, copied on start).
      - app-media:/var/www/html/storage/app/public

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DB_DATABASE:-bytecode}
      - POSTGRES_USER=${DB_USERNAME:-bytecode}
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  app-media:
  db-data:
