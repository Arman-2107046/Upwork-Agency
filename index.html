<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%TITLE%</title>
    <meta name="description" data-rh="true" content="%DESCRIPTION%" />
    <link rel="canonical" data-rh="true" href="%SITE_URL%/" />
    <meta name="theme-color" data-rh="true" content="%THEME_COLOR%" />
    <meta property="og:type" data-rh="true" content="website" />
    <meta property="og:site_name" data-rh="true" content="%BRAND%" />
    <meta property="og:title" data-rh="true" content="%TITLE%" />
    <meta property="og:description" data-rh="true" content="%DESCRIPTION%" />
    <meta property="og:url" data-rh="true" content="%SITE_URL%/" />
    <meta property="og:image" data-rh="true" content="%SITE_URL%/og-image.png" />
    <meta name="twitter:card" data-rh="true" content="summary_large_image" />
    <!-- Tags marked data-rh are defaults for crawlers without JS; react-helmet-async
         replaces them per route. -->

    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- Fonts are self-hosted via Fontsource (bundled, same origin), so no third-party
         preconnect is needed. If you switch to a font CDN, add its preconnect here. -->

    <!--ORG_JSON_LD-->

    <script>
      // Apply the saved theme before first paint to avoid a flash.
      ;(function () {
        try {
          var t = localStorage.getItem('theme')
          if (t === 'dark') document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <noscript>
      <p style="padding: 24px; font-family: system-ui, sans-serif">
        This website needs JavaScript enabled to display its content.
      </p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
