# Local overrides: the site on http://localhost:8080 (APP_PORT changes it) (database shell: docker compose exec db psql -U bytecode).
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up --build
services:
  app:
    ports:
      - '${APP_PORT:-8080}:8080'
    environment:
      APP_ENV: local
      APP_DEBUG: 'true'
      SESSION_SECURE_COOKIE: 'false'
      LOG_LEVEL: debug
